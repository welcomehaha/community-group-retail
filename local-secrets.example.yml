# 后端服务端口
SERVER_PORT: 8080

# Spring Profile
SPRING_PROFILES_ACTIVE: dev

# 数据库配置
DB_DRIVER: com.mysql.cj.jdbc.Driver
DB_HOST: localhost
DB_PORT: 3306
DB_NAME: community_retail
DB_USERNAME: root
DB_PASSWORD: replace_me

# Redis 配置
REDIS_HOST: localhost
REDIS_PORT: 6379
