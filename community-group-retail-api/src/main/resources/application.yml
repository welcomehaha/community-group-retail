server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # 从后端启动目录加载本地敏感配置文件，不提交仓库。
    import: optional:file:./local-secrets.yml
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:community_retail}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:10}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.community.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      community:
        mapper: debug
        service: info
        controller: info

community:
  security:
    permission:
      # 兼容阶段默认允许未分配角色的管理端员工访问；角色数据补齐后建议改为 false。
      allow-admin-without-role: true
  jwt:
    # 通过环境变量传入管理端 JWT 密钥，长度必须不少于 32 字节。
    admin-secret-key: ${JWT_ADMIN_SECRET:admin-secret-key-community-retail-2026-secure}
    # 设置jwt过期时间
    admin-ttl: ${JWT_ADMIN_TTL:7200000}
    # 设置前端传递过来的令牌名称
    admin-token-name: ${JWT_ADMIN_TOKEN_NAME:token}
    # 通过环境变量传入用户端 JWT 密钥，长度必须不少于 32 字节。
    user-secret-key: ${JWT_USER_SECRET:user-secret-key-community-retail-2026-secure}
    user-ttl: ${JWT_USER_TTL:7200000}
    user-token-name: ${JWT_USER_TOKEN_NAME:authentication}
  alioss:
    endpoint: ${ALI_OSS_ENDPOINT:}
    access-key-id: ${ALI_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALI_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALI_OSS_BUCKET_NAME:}
  wechat:
    appid: ${WECHAT_APP_ID:}
    secret: ${WECHAT_APP_SECRET:}
    mchid: ${WECHAT_MCH_ID:}
    mchSerialNo: ${WECHAT_MCH_SERIAL_NO:}
    privateKeyFilePath: ${WECHAT_PRIVATE_KEY_FILE_PATH:}
    apiV3Key: ${WECHAT_API_V3_KEY:}
    weChatPayCertFilePath: ${WECHAT_PAY_CERT_FILE_PATH:}
    notifyUrl: ${WECHAT_NOTIFY_URL:}
    refundNotifyUrl: ${WECHAT_REFUND_NOTIFY_URL:}
  shop:
    address: 广东省广州市白云区江高镇学苑路1号
  baidu:
    ak: ${BAIDU_AK:}
